services:
  - type: web
    name: voxerameta-backend
    env: node
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COLAB_SECRET
        sync: false          # ZORUNLU — Colab notebook'taki COLAB_SECRET ile AYNI (en az 16 karakter)
      - key: BASE_URL
        value: https://voxerameta-ai-backend.onrender.com   # kendi Render adresinizle değiştirin
      - key: LYRICS_MODE
        value: preserve      # preserve = sözleriniz aynen kalır (önerilen, ücretsiz). rewrite = LLM uyarlar (Groq/OpenRouter/Gemini anahtarı gerekir)
      - key: LOCAL_STORAGE_PATH
        value: /tmp/voxerameta-songs
      - key: MAX_REQUESTS_PER_MINUTE
        value: 20
      - key: MAX_SONG_SECONDS
        value: 300           # uygulama 2-5 dk sunar
      - key: JOB_TIMEOUT_SECONDS
        value: 3000          # 5 dk'lık şarkı + Whisper kontrolü için 50 dk
      - key: API_AUTH_TOKEN
        sync: false          # BOŞ BIRAKIN / SİLİN. Doluysa uygulama aynı token'ı gönderemezse 401 alır
      - key: GROQ_API_KEY
        sync: false          # yalnızca LYRICS_MODE=rewrite için
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
