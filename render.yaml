services:
  - type: web
    name: voxerameta-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: COLAB_MUSIC_API_URL
        sync: false
      - key: LOCAL_MUSIC_API_URL
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: API_AUTH_TOKEN
        sync: false
      - key: BASE_URL
        sync: false
      - key: LOCAL_STORAGE_PATH
        value: /tmp/voxerameta-songs
      - key: MAX_REQUESTS_PER_MINUTE
        value: 20
